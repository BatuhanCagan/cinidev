<body class="bg-background text-on-background font-body-md min-h-screen flex overflow-hidden">

<nav class="fixed left-0 top-0 h-full w-[280px] bg-surface border-r border-primary/10 shadow-[0px_4px_20px_rgba(0,59,122,0.05)] flex flex-col py-container-padding z-10 opacity-30">
<div class="px-gutter mb-8">
<h1 class="font-headline-lg text-headline-lg font-bold text-primary tracking-tight">ÇiniDev</h1>
<p class="font-label-md text-label-md text-outline mt-1">Master Architect</p>
</div>
<div class="flex-1 px-4 space-y-2">
<!-- Simulated Nav Items -->
<div class="flex items-center px-4 py-3 rounded-lg bg-surface-container text-on-surface-variant"><span class="material-symbols-outlined mr-3">dashboard</span><span class="font-body-md text-body-md">Dashboard</span></div>
<div class="flex items-center px-4 py-3 rounded-lg text-secondary font-bold border-r-4 border-secondary bg-surface-container-low"><span class="material-symbols-outlined mr-3">account_tree</span><span class="font-body-md text-body-md">Projects</span></div>
</div>
</nav>

<div class="flex gap-6">
<span class="font-body-md text-body-md text-on-surface-variant">Status</span>
</div>
</header>
<!-- Modal Overlay Container -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 sm:ml-[280px]">
<!-- Backdrop -->
<div aria-hidden="true" class="absolute inset-0 bg-primary/20 backdrop-blur-sm transition-opacity"></div>
<!-- Modal Dialog -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative w-full max-w-2xl bg-surface-bright rounded-xl ceramic-shadow overflow-hidden flex flex-col max-h-[921px]" role="dialog">
<!-- Ceramic Header Strip (Iznik Pattern) -->
<div class="h-2 w-full iznik-border"></div>
<!-- Modal Header -->
<div class="px-8 py-6 border-b border-primary/10 flex items-center justify-between bg-surface-container-lowest">
<div>
<h2 class="font-headline-md text-headline-md text-primary font-bold" id="modal-title">Add New Project</h2>
<p class="font-body-md text-body-md text-outline mt-1">Add a new building block to your workspace.</p>
</div>
<button aria-label="Close" class="text-outline hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-container" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="px-8 py-8 overflow-y-auto bg-surface-container-lowest">
<form class="space-y-6">
<!-- Project Name -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="project_name">Project Name</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary focus:shadow-[0_0_12px_rgba(0,107,95,0.2)] transition-shadow placeholder-outline/50 outline-none" id="project_name" name="project_name" placeholder="e.g. cini-api-service" type="text"/>
</div>
<!-- Project Directory -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="folder_path">Project Directory</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-4 pr-12 py-3 font-code-sm text-code-sm text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary focus:shadow-[0_0_12px_rgba(0,107,95,0.2)] transition-shadow placeholder-outline/50 outline-none" id="folder_path" name="folder_path" placeholder="/Users/dev/projects/" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">folder_open</span>
</div>
</div>
</div>
<!-- Tech Stack -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2">Tech Stack</label>
<div class="w-full bg-surface-bright border border-outline-variant rounded-lg p-3 min-h-[56px] focus-within:ring-2 focus-within:ring-secondary focus-within:border-secondary focus-within:shadow-[0_0_12px_rgba(0,107,95,0.2)] transition-shadow cursor-text flex flex-wrap gap-2 items-center">
<!-- Selected Chips -->
<span class="inline-flex items-center px-3 py-1 rounded-full bg-secondary/10 text-secondary border border-secondary/20">
<span class="font-label-md text-[12px] leading-[16px] mr-1">React</span>
<button class="hover:text-primary transition-colors flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">close</span></button>
</span>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-primary/10 text-primary border border-primary/20">
<span class="font-label-md text-[12px] leading-[16px] mr-1">Node.js</span>
<button class="hover:text-secondary transition-colors flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">close</span></button>
</span>
<input class="flex-1 min-w-[100px] border-none bg-transparent p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder-outline/50 outline-none" placeholder="Search..." type="text"/>
</div>
<p class="font-body-md text-[13px] text-outline mt-2">Select the frameworks and libraries used by this project.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Port Configuration -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="port_config">Port Configuration</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 font-code-sm text-code-sm text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary focus:shadow-[0_0_12px_rgba(0,107,95,0.2)] transition-shadow placeholder-outline/50 outline-none" id="port_config" name="port_config" placeholder="3000" type="number"/>
</div>

<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="start_command">Start Command</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 font-code-sm text-code-sm text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary focus:shadow-[0_0_12px_rgba(0,107,95,0.2)] transition-shadow placeholder-outline/50 outline-none" id="start_command" name="start_command" placeholder="npm run dev" type="text"/>
</div>
</div>
</form>

<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md text-secondary border-[1.5px] border-secondary hover:bg-secondary/5 transition-colors" type="button">
                    Cancel
                </button>
<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md text-on-primary bg-primary hover:bg-secondary shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200" style="background-image: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);" type="button">
